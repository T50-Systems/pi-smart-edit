name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.34.9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Build and test
        run: pnpm test

      - name: Enforce coverage budgets
        run: pnpm run coverage

      - name: Verify repository policy and workflow YAML
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: |
          pnpm run verify:policy
          pnpm run verify:workflows

      - name: Verify release package
        if: matrix.node-version == 22
        run: pnpm run verify:release

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
